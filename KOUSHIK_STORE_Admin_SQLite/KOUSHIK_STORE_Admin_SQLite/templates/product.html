{% extends "base.html" %}{% block content %}<section class="container detail"><img src="{{product.image}}" alt="{{product.name}}"><div><small>{{product.category}}</small><h1>{{product.name}}</h1><h2>₹{{"{:,}".format(product.price)}} <del>₹{{"{:,}".format(product.old_price)}}</del></h2><p>Premium selected saree, carefully packed for delivery.</p><form method="post" action="{{url_for('add',pid=product.id)}}"><input name="qty" type="number" value="1" min="1" max="20"><button class="btn">Add to Bag</button></form></div></section>{% endblock %}
