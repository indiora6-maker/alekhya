{% extends "admin/base.html" %}{% block heading %}{{'Edit' if product else 'Add'}} Product{% endblock %}{% block content %}<section class="formpanel"><form method="post"><label>Name<input name="name" value="{{product.name if product else ''}}" required></label><label>Category<select name="category">{% for x in ['Kanjivaram','Banarasi','Soft Silk','Cotton'] %}<option>{{x}}</option>{% endfor %}</select></label><div class="two"><label>Price<input name="price" type="number" value="{{product.price if product else ''}}" required></label><label>Original Price<input name="old_price" type="number" value="{{product.old_price if product else ''}}"></label></div><label>Image URL<input name="image" value="{{product.image if product else ''}}" required></label><label>Tag<input name="tag" value="{{product.tag if product else ''}}"></label>{% if product %}<label><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Visible</label>{% endif %}<button class="primary">Save Product</button></form></section>{% endblock %}
