<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ALEKHYA ADMIN{% endblock %}</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='admin.css')}}"></head><body><aside><a class="logo" href="{{url_for('admin_dashboard')}}">ALEKHYA <span>ADMIN</span></a><nav><a href="{{url_for('admin_dashboard')}}">Dashboard</a><a href="{{url_for('admin_orders')}}">Orders</a><a href="{{url_for('admin_products')}}">Products</a><a href="{{url_for('home')}}" target="_blank">View Store ↗</a></nav><form method="post" action="{{url_for('admin_logout')}}"><button>Logout</button></form></aside><main class="admin"><header><div><small>ADMIN PANEL</small><h1>{% block heading %}Dashboard{% endblock %}</h1></div><span>● {{session.get('admin_username')}}</span></header>{% with m=get_flashed_messages(with_categories=true) %}{% for c,x in m %}<div class="notice">{{x}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
