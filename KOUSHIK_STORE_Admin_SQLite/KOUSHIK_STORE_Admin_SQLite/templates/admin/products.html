{% extends "admin/base.html" %}{% block heading %}Products{% endblock %}{% block content %}<p><a class="primary" href="{{url_for('new_product')}}">+ Add Product</a></p><section class="panel"><table><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Visibility</th><th></th></tr>{% for p in products %}<tr><td><img class="thumb" src="{{p.image}}"></td><td>{{p.name}}</td><td>{{p.category}}</td><td>₹{{"{:,}".format(p.price)}}</td><td>{{'Live' if p.active else 'Hidden'}}</td><td><a href="{{url_for('edit_product',pid=p.id)}}">Edit</a></td></tr>{% endfor %}</table></section>{% endblock %}
