{% extends "base.html" %}{% block content %}<div class="pagehero"><h1>Your Bag</h1></div><section class="container section">{% if items %}<form method="post" action="{{url_for('update')}}">{% for x in items %}<div class="cartitem"><img src="{{x.product.image}}"><div><h3>{{x.product.name}}</h3><p>₹{{"{:,}".format(x.subtotal)}}</p></div><input name="{{x.product.id}}" type="number" value="{{x.qty}}" min="0"></div>{% endfor %}<button class="btn">Update Bag</button></form><div class="summary"><h2>Total ₹{{"{:,}".format(grand_total)}}</h2><a class="btn" href="{{url_for('checkout')}}">Checkout</a></div>{% else %}<h2>Your bag is empty.</h2><a class="btn" href="{{url_for('shop')}}">Shop Sarees</a>{% endif %}</section>{% endblock %}
